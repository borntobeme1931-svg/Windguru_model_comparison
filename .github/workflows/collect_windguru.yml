name: Collect Windguru forecasts

on:
  schedule:
    - cron: '10 0,3,6,9,12,15,18,21 * * *'   # every 3 hours, at :10 past
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect-windguru:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: pip install requests playwright pandas tabulate

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Collect Windguru forecasts
        run: python collect_windguru.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data/
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "windguru: $(date -u '+%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break || (echo "Retry $i..." && sleep 5)
          done
