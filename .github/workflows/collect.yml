name: Collect weather data

on:
  schedule:
    - cron: '5 * * * *'   # every hour at :05
  workflow_dispatch:       # lets you trigger it manually too

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to commit back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests playwright pandas tabulate

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Collect data
        run: python weather_tracker.py

      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data/
          git diff --cached --quiet || git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M')Z"
          git push
